# The field devices' listener (deploy/compose.yml publishes it on MQTT_BIND_ADDRESS, the VPN address only;
# docs/ops/access.md). MQTT_DEVICE_AUTH=clientcert (the default): a device needs BOTH a client certificate signed by the
# farm's MQTT CA (scripts/mqtt-certs.sh) AND its own user and password (a Credential on the Sensors pages); what it may
# publish is its own topics only (the acl that manage.py sensor_broker_sync writes). A device that cannot hold a client
# certificate uses MQTT_DEVICE_AUTH=password instead (../password/tls.conf).
listener 8883
protocol mqtt
cafile /mosquitto/tls/ca.crt
certfile /mosquitto/tls/server.crt
keyfile /mosquitto/tls/server.key
tls_version tlsv1.2
require_certificate true
use_identity_as_username false
