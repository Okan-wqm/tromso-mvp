{% extends "auth_base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<h1>Reset your password</h1>
<p class="lead">Enter the email address on your account. We will send you a link to set a new password.</p>
<form method="post" novalidate>
  {% csrf_token %}
  {% include "registration/_form.html" %}
  <button type="submit" class="button">Send reset link</button>
</form>
<p class="links"><a href="{% url 'login' %}">Back to sign in</a></p>
{% endblock %}
