# The field devices' listener with server TLS only (MQTT_DEVICE_AUTH=password; docs/ops/access.md): the connection is
# encrypted and the broker proves who it is, a device signs in with its own user and password (a Credential on the
# Sensors pages) and may publish its own topics only. No client certificate: for devices that cannot hold one. The
# VPN in front stays required.
listener 8883
protocol mqtt
certfile /mosquitto/tls/server.crt
keyfile /mosquitto/tls/server.key
tls_version tlsv1.2
require_certificate false
