{% load i18n %}{# The language segment (core.views.set_language): sets the cookie and, signed in, the account. #}
<form class="language-switch" method="post" action="{% url 'core:set_language' %}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <div role="group" aria-label="{% trans "Language" %}">
    {% for code, name in LANGUAGES %}
    <button type="submit" name="language" value="{{ code }}" lang="{{ code }}" aria-label="{{ name }}" title="{{ name }}"{% if code == LANGUAGE_CODE %} aria-current="true"{% endif %}>{{ code|upper }}</button>
    {% endfor %}
  </div>
</form>
