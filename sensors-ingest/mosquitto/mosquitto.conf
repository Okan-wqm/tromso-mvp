# Mosquitto 2.0.20 for the Sensors subsystem (plan decision 11, spikes S0e/S0f in sensors-ingest/spikes/SPIKES.md).
# The broker the field devices publish to and the ingest subscribes from. No dynamic-security plugin: users and topic
# rights are the files in /mosquitto/auth, written by `manage.py sensor_broker_sync` from the Credential and Device rows
# and reloaded by the entrypoint within 5 s of a change (SIGHUP; connected clients stay, a removed user is cut off).

per_listener_settings false
allow_anonymous false
password_file /mosquitto/auth/passwd
acl_file /mosquitto/auth/acl

# Inside the compose network (the ingest, the simulator). Field devices outside use the TLS listener: put a
# conf.d/tls.conf with `listener 8883`, `certfile`, `keyfile` (and `cafile`/`require_certificate` for client
# certificates) next to this file; it is read through include_dir.
listener 1883
include_dir /mosquitto/config/conf.d

# Persistent sessions survive a broker restart. A HARD crash can lose what arrived after the last autosave (plan risk 3,
# owner-accepted, measured in BENCH.md): 5 s.
persistence true
persistence_location /mosquitto/data/
autosave_interval 5

# Spike S0e: with manual acks the ingest's unacknowledged window is the brake. 5000 in flight per session; the
# ingest's queue (INGEST_QUEUE, default 10000) is larger, so a QoS 1 message never waits on the reader's side for long.
max_inflight_messages 5000
# While the ingest is down its session queues messages. No count cap; a byte cap keeps the broker's memory bounded
# (512 MiB, about 2.5 million 200-byte messages). Beyond it the broker drops (and logs) new messages for that
# session: the ingest outage the farm can absorb is that volume divided by the message rate (BENCH.md).
max_queued_messages 0
max_queued_bytes 536870912
queue_qos0_messages false

# Above the ingest's own 64 KiB decode limit (a larger message reaches the ingest and is dead-lettered `oversize` as
# evidence) and below the ingest client's 300 KiB packet limit (the client never refuses what the broker sends).
max_packet_size 262144
max_keepalive 600
set_tcp_nodelay true

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
