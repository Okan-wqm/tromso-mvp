# Local development database: PostgreSQL 17 with the TimescaleDB extension.
#   docker compose up -d
services:
  db:
    image: timescale/timescaledb:2.17.2-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-balik}
      POSTGRES_USER: ${DB_USER:-balik}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-balik}
    # No usage reports to Timescale, and no telemetry job running in every database (each test
    # database included). A server setting, so it also holds for an existing data volume.
    command: ["postgres", "-c", "timescaledb.telemetry_level=off"]
    ports: ["${DB_PORT:-5433}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

volumes:
  pgdata: {}
