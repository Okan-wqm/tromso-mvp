{% load assets i18n %}<!doctype html>
<html lang="{{ LANGUAGE_CODE }}" data-theme="{{ THEME|default:"industry" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% trans "Sign in" %}{% endblock %} · Suderra</title>
  <link rel="icon" href="{% asset 'favicon.svg' %}" type="image/svg+xml">
  {% module_map %}
  <link rel="stylesheet" href="{% asset 'css/fonts.css' %}">
  <link rel="stylesheet" href="{% asset 'css/tokens.css' %}">
  <link rel="stylesheet" href="{% asset 'css/base.css' %}">
  <link rel="stylesheet" href="{% asset 'css/ds.css' %}">
  <link rel="stylesheet" href="{% asset 'css/auth.css' %}">
</head>
<body>
  <div class="auth">
    <aside class="skin" aria-hidden="true">
      <p class="brand">Suderra</p>
      <p class="skin-note">{% trans "Farm console for tanks, water quality and stock records." %}</p>
    </aside>
    <main class="panel">
      {% include "_language_switcher.html" %}
      <div class="panel-inner">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
  <script type="module" src="{% asset 'js/auth.js' %}"></script>
</body>
</html>
