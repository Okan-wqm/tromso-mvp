{# A value worked out from the record (core.widgets.Output), labelled by the field's <label for>; an input's own attributes (disabled, required) do not apply to it. #}<output class="output"{% for name, value in widget.attrs.items %}{% if name != "disabled" and name != "required" and value is not False %} {{ name }}{% if value is not True %}="{{ value|stringformat:'s' }}"{% endif %}{% endif %}{% endfor %}>{% if widget.value %}{{ widget.value }}{% else %}–{% endif %}</output>
