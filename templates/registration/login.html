{% extends "auth_base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
<p class="lead">Use your username and password to open the farm console.</p>
<form method="post" novalidate>
  {% csrf_token %}
  {% include "registration/_form.html" %}
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit" class="button">Sign in</button>
</form>
<p class="links"><a href="{% url 'password_reset' %}">Forgot your password?</a></p>
{% endblock %}
