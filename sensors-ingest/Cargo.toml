[package]
name = "sensors-ingest"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "LicenseRef-Suderra-Proprietary"
publish = false
description = "MQTT ingest of the fish-farm Sensors subsystem: subscribe, decode, validate, reduce, batch-write to TimescaleDB"

[dependencies]
rumqttc = { version = "0.25.1", default-features = false, features = ["use-rustls"] }
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
tokio-postgres = { version = "0.7.13", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
chrono = { version = "0.4.41", default-features = false, features = ["std", "clock"] }
uuid = { version = "1.17", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
thiserror = "2.0.12"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", default-features = false, features = ["fmt", "std", "env-filter", "json"] }
axum = { version = "0.8.4", default-features = false, features = ["http1", "json", "tokio"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }

[dev-dependencies]
proptest = { version = "1.7", default-features = false, features = ["std"] }

[profile.release]
debug = 1
panic = "abort"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
