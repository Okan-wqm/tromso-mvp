# The licence gate (plan decision 12, owner rule: no dependency whose licence forbids commercial use).
# `cargo deny --locked check` runs in tests/run.sh; THIRD_PARTY lists every crate and its licence.

[graph]
all-features = false
no-default-features = false

[licenses]
# Permissive licences only. Anything else fails the build until it is reviewed and added here with a reason.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0", # webpki-root-certs / webpki-roots data (permissive data licence, plan 1.4)
    "OpenSSL",
]
confidence-threshold = 0.93

[licenses.private]
# this crate itself (publish = false) is Suderra's own
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
deny = [
    # non-commercial licence (owner rule A3)
    { crate = "rodbus" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
# RustSec advisories: a vulnerable or yanked crate fails the gate (needs network to fetch the database).
yanked = "deny"
ignore = [
    # rumqttc 0.25.1 (latest) still names rustls-webpki 0.102 only for an error type (src/tls.rs: TlsError::WebPki);
    # certificate verification runs in rustls 0.23 on rustls-webpki 0.103.16, which carries both fixes
    # (`cargo tree -i rustls-webpki@0.103`). No CRL is parsed. Re-check when rumqttc moves to 0.103.
    { id = "RUSTSEC-2026-0104", reason = "0.102 only used as an error type by rumqttc; verification is on 0.103.16" },
    { id = "RUSTSEC-2026-0382", reason = "0.102 only used as an error type by rumqttc; verification is on 0.103.16" },
    { id = "RUSTSEC-2026-0049", reason = "0.102 only used as an error type by rumqttc; verification is on 0.103.16" },
    { id = "RUSTSEC-2026-0098", reason = "0.102 only used as an error type by rumqttc; verification is on 0.103.16" },
    { id = "RUSTSEC-2026-0099", reason = "0.102 only used as an error type by rumqttc; verification is on 0.103.16" },
    # rustls-pemfile 2.2.0 is unmaintained (not vulnerable): rumqttc reads the CA PEM with it; re-check with rumqttc.
    { id = "RUSTSEC-2025-0134", reason = "unmaintained, no known vulnerability; only parses our own CA bundle" },
]
