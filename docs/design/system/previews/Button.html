<button class="ui-btn" data-variant="primary"><svg class="ui-icon"><use href="#i-plus"/></svg>Record meal</button>
<button class="ui-btn">Record water sample</button>
<button class="ui-btn" data-variant="link">How rations are worked out</button>
<button class="ui-btn" data-variant="danger">Delete feed</button>
<button class="ui-btn" disabled>Record meal</button>
<button class="ui-btn" data-variant="primary" data-size="coarse">Record meal</button>
</div>

<div class="theme-switch" role="group" aria-label="Theme"><button data-t="fjord" aria-pressed="true">Fjord</button><button data-t="polarnatt" aria-pressed="false">Polarnatt</button><button data-t="nordlys" aria-pressed="false">Nordlys</button><button data-t="tang" aria-pressed="false">Tang</button><button data-t="laks" aria-pressed="false">Laks</button></div>
<script>document.querySelectorAll('.theme-switch button').forEach(b=>b.onclick=()=>{document.documentElement.dataset.theme=b.dataset.t;document.querySelectorAll('.theme-switch button').forEach(x=>x.setAttribute('aria-pressed',x===b))});</script>
